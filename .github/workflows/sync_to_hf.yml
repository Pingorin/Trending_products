name: Sync to Hugging Face Space

# Yeh action tab chalega jab aap 'main' branch par code push karenge
on:
  push:
    branches: [main] 

  # Yeh option aapko GitHub Actions tab se manually run karne ki permission deta hai
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Pura commit history fetch karne ke liye (zaroori hai)

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Niche YOUR_HF_USERNAME aur YOUR_SPACE_NAME ko apne details se replace karein
          git push --force https://Sona55:$HF_TOKEN@huggingface.co/spaces/Sona55/trending_sales main
